// Znajdź najniższą wolną odznakę w przedziale dla danego stopnia (z wiodącymi zerami)
function assignBadge(rank, officers) {
  const rangeKey = RANK_TO_RANGE_KEY[rank];
  if (!rangeKey) return "";
  const [min, max] = RANK_BADGE_RANGES[rangeKey];
  const used = new Set(officers.map(o => parseInt(o.badge)).filter(n => !isNaN(n)));
  const digits = Math.max(2, String(max).length);
  for (let b = min; b <= max; b++) {
    if (!used.has(b)) return String(b).padStart(digits, '0');
  }
  return "";
}

// ─── GRUPY STOPNI → kolor wiersza ────────────────────────────────────────────
function getRankGroup(rank) {
  if (["Chief of Police","Assistant Chief","Deputy Chief","Commander"].includes(rank)) return "highcommand";
  if (rank === "Captain") return "captain";
  if (["Lieutenant II","Lieutenant I"].includes(rank)) return "lieutenant";
  if (["Master Sergeant","Staff Sergeant","Sergeant"].includes(rank)) return "sergeant";
  if (["Officer III+1","Officer III","Officer II","Officer I"].includes(rank)) return "officer";
  if (rank === "Cadet") return "cadet";
  return "officer";
}

function getRankColor(rank) {
  const g = getRankGroup(rank);
  if (g === "highcommand") return { row:"rgba(128,0,128,0.10)", name:"#c084fc" };
  if (g === "captain")     return { row:"rgba(231,76,60,0.07)",  name:"#ff8a7a" };
  if (g === "lieutenant")  return { row:"rgba(155,89,182,0.07)", name:"#c39bd3" };
  if (g === "sergeant")    return { row:"rgba(30,95,196,0.10)",  name:"#7fb3ff" };
  if (g === "cadet")       return { row:"rgba(32,178,72,0.07)",  name:"#5dde85" };
  return { row:"rgba(255,255,255,0.02)", name:"var(--white)" };
}

// ─── BAZA DANYCH (JSONBin chmura + localStorage fallback) ────────────────────
const dbApi = {
  async load() {
    if (USE_CLOUD) {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { "X-Master-Key": JSONBIN_API_KEY }
        });
        if (res.ok) {
          const json = await res.json();
          const rec = json.record;
          if (rec && rec.officers && rec.officers.length > 0) return rec;
        }
      } catch(e) { console.warn("JSONBin load failed:", e); }
    }
    try {
      const o = localStorage.getItem("lspd-officers");
      const l = localStorage.getItem("lspd-log");
      const r = localStorage.getItem("lspd-regs");
      return {
        officers: o ? JSON.parse(o) : INIT.officers,
        log:      l ? JSON.parse(l) : INIT.log,
        regs:     r ? JSON.parse(r) : INIT.regs };
    } catch { return INIT; }
  },

  async save(data) {
    try {
      localStorage.setItem("lspd-officers", JSON.stringify(data.officers));
      localStorage.setItem("lspd-log",      JSON.stringify(data.log));
      localStorage.setItem("lspd-regs",     JSON.stringify(data.regs));
    } catch {}
    if (USE_CLOUD) {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_API_KEY },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error("JSONBin PUT failed");
    }
  }
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function getStatus(o) {
  if (o.suspended)   return { label:"ZAWIESZONY", cls:"s-suspended" };
  if (o.redEntry)    return { label:"CZERWONY",   cls:"s-red"       };
  if (o.yellowEntry) return { label:"ŻÓŁTY",      cls:"s-yellow"    };
  if (o.onLeave)     return { label:"URLOP",       cls:"s-leave"     };
  return { label:"AKTYWNY", cls:"s-active" };
}


function Ck({ val }) {
  return val
    ? <span style={{color:"#2ecc71",fontSize:14}}>✓</span>
    : <span style={{color:"#3a4a60",fontSize:14}}>—</span>;
}

function SaveIndicator({ status }) {
  if (status === "idle") return null;
  const cfg = {
    saving: { color:"var(--gold)",  text:"Zapisywanie..." },
    saved:  { color:"var(--green)", text:"Zapisano ✓"     },
    error:  { color:"var(--red)",   text:"Błąd zapisu!"   } }[status] || {};
  return (
    <div style={{
      position:"fixed", bottom:20, right:20, zIndex:9999,
      background:"rgba(8,16,31,0.96)", border:`1px solid ${cfg.color}`,
      borderRadius:4, padding:"8px 16px",
      fontFamily:"'Share Tech Mono',monospace", fontSize:11, letterSpacing:2,
      color:cfg.color, boxShadow:`0 0 20px rgba(0,0,0,.5)`
    }}>{cfg.text}</div>
  );
}

function LoginModal({ onLogin, onClose }) {
  const [login, setLogin] = useState(""); const [pass, setPass] = useState(""); const [err, setErr] = useState("");
  const submit = () => { const f = ADMIN_CREDENTIALS.find(c=>c.login===login&&c.password===pass); f?onLogin(f):setErr("Nieprawidłowy login lub hasło."); };
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="login-card">
        <div className="login-logo">LSPD</div>
        <div className="login-sub">PANEL ZARZĄDU — DOSTĘP ZASTRZEŻONY</div>
        {err&&<div className="login-err">{err}</div>}
        <div className="fg" style={{marginBottom:12,textAlign:"left"}}><label>Login</label><input value={login} onChange={e=>setLogin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} autoFocus/></div>
        <div className="fg" style={{marginBottom:20,textAlign:"left"}}><label>Hasło</label><input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-gold" style={{flex:1,justifyContent:"center"}} onClick={submit}>ZALOGUJ</button>
          <button className="btn btn-red btn-sm" onClick={onClose}>✕</button>
        </div>
      </div>
    </div>
  );
}

  const iadCnt = officers.filter(o=>o.iad).length;
  const ftdCnt  = officers.filter(o=>o.ftd).length;
  return (
    <div>
      <div style={{marginBottom:24}}>
        <div style={{fontFamily:"'Oswald',sans-serif",fontSize:28,fontWeight:700,letterSpacing:4}}>PANEL GŁÓWNY <span style={{color:"var(--gold)"}}>LSPD</span></div>
        <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:"var(--gray)",letterSpacing:2,marginTop:4}}>LOS SANTOS POLICE DEPARTMENT — SYSTEM ZARZĄDZANIA</div>

        <div className="stat-card blue"><div className="stat-num" style={{color:"var(--accent)"}}>{officers.length}</div><div className="stat-label">Funkcjonariuszy</div></div>
        <div className="stat-card green"><div className="stat-num" style={{color:"var(--green)"}}>{active}</div><div className="stat-label">Aktywnych</div></div>
        <div className="stat-card red"><div className="stat-num" style={{color:"var(--red)"}}>{suspended}</div><div className="stat-label">Zawieszonych</div></div>
        <div className="stat-card gold"><div className="stat-num" style={{color:"var(--gold)"}}>{log.length}</div><div className="stat-label">Wpisów</div></div>
      </div>

        <div className="card">
          <div className="card-title">Jednostki Specjalne <span className="tag">UNITS</span></div>
          {[["SWAT",swatCnt,"var(--red)"],["IAD",iadCnt,"var(--gold)"],["FTD",ftdCnt,"var(--accent)"]].map(([name,cnt,color])=>(

                <div style={{width:`${officers.length?Math.min(100,(cnt/officers.length)*100):0}%`,height:"100%",background:color,borderRadius:2,transition:"width .5s"}}/>
              </div>
              <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:13,color,minWidth:24,textAlign:"right"}}>{cnt}</span>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="card-title">Ostatnie Wpisy <span className="tag">LOG</span></div>
          {[...log].reverse().slice(0,4).map(l=>(
            <div key={l.id} style={{borderBottom:"1px solid var(--border)",paddingBottom:10,marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>

function OfficersView({ officers, setOfficers, isAdmin }) {
  const [search, setSearch] = useState("");
  const [filterUnit,   setFilterUnit]   = useState("ALL");
  const [filterStatus, setFilterStatus] = useState("ALL");
  const [filterRank,   setFilterRank]   = useState("ALL");
  const [modal, setModal] = useState(null);
  const [selected, setSelected] = useState(new Set());
  const [bulkModal, setBulkModal] = useState(false);

  const sortByBadge = arr => [...arr].sort((a,b) => {
    const na = parseInt(a.badge);
    const nb = parseInt(b.badge);
    const aEmpty = !a.badge || isNaN(na);
    const bEmpty = !b.badge || isNaN(nb);
    if (aEmpty && bEmpty) return 0;
    if (aEmpty) return 1;
    if (bEmpty) return -1;
    if (na !== nb) return na - nb;
    return (a.badge||"").localeCompare(b.badge||"");
  });

  const filtered = sortByBadge(officers.filter(o=>{
    const q=search.toLowerCase();
    const okQ = !q||o.name.toLowerCase().includes(q)||o.badge.includes(q)||(o.nick||"").toLowerCase().includes(q);
    const okU = filterUnit==="ALL" || o[filterUnit]===true;
    const okS = filterStatus==="ALL" || getStatus(o).label===filterStatus;
    const okR = filterRank==="ALL" || o.rank===filterRank;
    return okQ && okU && okS && okR;
  }));
  const save = form => {
    if(modal.type==="add") {
      const badge = assignBadge(form.rank, officers);
      const newOfficer = {...form, badge, id:Date.now()};
      setOfficers(p=>sortByBadge([...p, newOfficer]));
      sendDiscordLog(discordEmbed(
        "➕ Dodano funkcjonariusza",
        null,
        0x2ecc71,
        [
          { name: "Imię i Nazwisko", value: form.name || "—", inline: true },
          { name: "Nick",            value: form.nick || "—", inline: true },
          { name: "Stopień",         value: form.rank || "—", inline: true },
          { name: "Odznaka",         value: badge ? "#"+badge : "—", inline: true },
        ]
      ));
    } else {
      setOfficers(p=>sortByBadge(p.map(o=>{
        if(o.id!==modal.officer.id) return o;
        let badge = form.badge;
        if(form.rank !== o.rank) { badge = assignBadge(form.rank, p); }
        const updated = {...form, badge, id:o.id};
        // Wykryj zmiany do loga
        const changes = [];
        if(form.name !== o.name) changes.push(`Imię: **${o.name}** → **${form.name}**`);
        if(form.nick !== o.nick) changes.push(`Nick: **${o.nick}** → **${form.nick}**`);
        if(form.rank !== o.rank) changes.push(`Stopień: **${o.rank}** → **${form.rank}**`);
        if(badge !== o.badge)    changes.push(`Odznaka: **#${o.badge}** → **#${badge}**`);
        const statusFields = [["suspended","Zawieszony"],["redEntry","Czerwony wpis"],["yellowEntry","Żółty wpis"],["onLeave","Urlop"]];
        statusFields.forEach(([k,l])=>{ if(form[k]!==o[k]) changes.push(`${l}: **${o[k]?"TAK":"NIE"}** → **${form[k]?"TAK":"NIE"}**`); });
        if(changes.length>0) {
          sendDiscordLog(discordEmbed(
            "✏️ Edytowano funkcjonariusza",
            null,
            0x3498db,
            [
              { name: "Funkcjonariusz", value: `${form.name} (${form.nick||"—"})`, inline: false },
              { name: "Zmiany", value: changes.join("\n"), inline: false },
            ]
          ));
        }
        return updated;
      })));
    }
    setModal(null);
  };
  const remove = id => {
    if(window.confirm("Usunąć funkcjonariusza?")) {
      const officer = officers.find(o=>o.id===id);
      setOfficers(p=>p.filter(o=>o.id!==id));
      setSelected(s=>{const n=new Set(s);n.delete(id);return n;});
      if(officer) sendDiscordLog(discordEmbed(
        "🗑️ Usunięto funkcjonariusza",
        null,
        0xe74c3c,
        [
          { name: "Imię i Nazwisko", value: officer.name || "—", inline: true },
          { name: "Nick",            value: officer.nick || "—", inline: true },
          { name: "Stopień",         value: officer.rank || "—", inline: true },
          { name: "Odznaka",         value: officer.badge ? "#"+officer.badge : "—", inline: true },
        ]
      ));
    }
  };

  const toggleSelect = id => setSelected(s=>{const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n;});
  const toggleAll = () => setSelected(s => s.size===filtered.length ? new Set() : new Set(filtered.map(o=>o.id)));

  const bulkRemove = () => {
    if(!window.confirm(`Usunąć ${selected.size} zaznaczonych funkcjonariuszy?`)) return;
    const removed = officers.filter(o=>selected.has(o.id));
    setOfficers(p=>p.filter(o=>!selected.has(o.id)));
    setSelected(new Set());
    sendDiscordLog(discordEmbed(
      "🗑️ Usunięto wielu funkcjonariuszy (bulk)",
      null,
      0xe74c3c,
      [{ name: `Usunięto ${removed.length} osób`, value: removed.map(o=>`• ${o.name} (${o.nick||"—"})`).join("\n").slice(0,1000) || "—", inline: false }]
    ));
  };

  const bulkSave = form => {
    const affected = officers.filter(o=>selected.has(o.id));
    setOfficers(p=>sortByBadge(p.map(o=>{
      if(!selected.has(o.id)) return o;
      const updated = {...o};
      if(form.rank) {
        updated.rank = form.rank;
        const ranges = {"Chief of Police":[1,9],"Assistant Chief":[1,9],"Deputy Chief":[1,9],"Commander":[1,9],
          "Captain":[10,19],"Lieutenant II":[20,29],"Lieutenant I":[30,39],"Master Sergeant":[40,49],
          "Staff Sergeant":[50,59],"Sergeant":[60,69],"Officer III+1":[70,79],"Officer III":[80,99],
          "Officer II":[100,129],"Officer I":[130,199],"Cadet":[200,299]};
        const [lo,hi] = ranges[form.rank]||[0,0];
        const badgeNum = parseInt(o.badge)||0;
        if(o.rank !== form.rank || badgeNum<lo || badgeNum>hi) updated.badge = assignBadge(form.rank, p);
      }
      Object.keys(form).forEach(k=>{ if(k!=="rank" && form[k]!==null) updated[k]=form[k]; });
      return updated;
    })));
    const changes = [];
    if(form.rank) changes.push(`Stopień → **${form.rank}**`);
    const statusFields = [["suspended","Zawieszony"],["redEntry","Czerwony wpis"],["yellowEntry","Żółty wpis"],["onLeave","Urlop"],["swat","SWAT"],["iad","IAD"],["ftd","FTD"]];
    statusFields.forEach(([k,l])=>{ if(form[k]!==null) changes.push(`${l} → **${form[k]?"TAK":"NIE"}**`); });
    sendDiscordLog(discordEmbed(
      "✏️ Edytowano wielu funkcjonariuszy (bulk)",
      null,
      0xf39c12,
      [
        { name: `Zmieniono ${affected.length} osób`, value: affected.map(o=>`• ${o.name}`).join("\n").slice(0,500) || "—", inline: false },
        { name: "Zastosowane zmiany", value: changes.join("\n") || "Brak zmian", inline: false },
      ]
    ));
    setSelected(new Set());
    setBulkModal(false);
  };
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:12}}>
        <div><div className="page-title">BAZA FUNKCJONARIUSZY</div><div className="page-sub">{filtered.length} / {officers.length} REKORDÓW</div></div>
        {isAdmin&&<button className="btn btn-primary" onClick={()=>setModal({type:"add"})}>+ DODAJ FP</button>}
      </div>
      <div className="search-bar">
        <input className="search-input" placeholder="Szukaj: nazwisko, odznaka, nick..." value={search} onChange={e=>setSearch(e.target.value)}/>
        <select className="filter-sel" value={filterRank} onChange={e=>setFilterRank(e.target.value)}>
          <option value="ALL">Wszystkie stopnie</option>
          {RANKS.map(r=><option key={r} value={r}>{RANK_BADGES[r]} — {r}</option>)}
        </select>
        <select className="filter-sel" value={filterUnit} onChange={e=>setFilterUnit(e.target.value)}>
          <option value="ALL">Wszystkie jednostki</option>
          <option value="swat">SWAT</option>
          <option value="iad">IAD</option>
          <option value="ftd">FTD</option>
        </select>
        <select className="filter-sel" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option value="ALL">Wszystkie statusy</option>
          <option>AKTYWNY</option><option>ZAWIESZONY</option><option>URLOP</option><option>ŻÓŁTY</option>
        </select>
      </div>
      {isAdmin&&selected.size>0&&(
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",marginBottom:8,background:"rgba(30,95,196,0.12)",border:"1px solid rgba(30,95,196,0.3)",borderRadius:4}}>
          <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:12,color:"var(--accent)"}}>Zaznaczono: {selected.size}</span>
          <button className="btn btn-gold btn-sm" onClick={()=>setBulkModal(true)}>✎ EDYTUJ ZAZNACZONE</button>
          <button className="btn btn-red btn-sm" onClick={bulkRemove}>✕ USUŃ ZAZNACZONE</button>
          <button className="btn btn-sm" style={{marginLeft:"auto",background:"transparent",border:"1px solid var(--border)",color:"var(--gray)"}} onClick={()=>setSelected(new Set())}>Odznacz wszystkie</button>
        </div>
      )}
      <div className="tbl-wrap">
        <table>
          <thead><tr>
            {isAdmin&&<th style={{width:32}}><input type="checkbox" checked={filtered.length>0&&selected.size===filtered.length} onChange={toggleAll}/></th>}
            <th>Odznaka</th><th>Imię i Nazwisko</th><th>Nick</th><th>Stopień</th><th>Status</th>
            <th>SWAT</th><th>IAD</th><th>FTD</th>
            <th style={{borderLeft:"2px solid rgba(200,168,75,0.3)"}}>FAC</th><th>SEU</th><th>SV</th><th>NT</th><th>PWC</th><th>WU</th><th>K9</th><th>ASU</th>
            {isAdmin&&<th>Akcje</th>}
          </tr></thead>
          <tbody>
            {(() => {
              const rows = [];
              filtered.forEach((o, i) => {
                const st = getStatus(o);
                const isAlert = o.suspended || o.redEntry;
                const isCB = o.commandBureau;
                const rc = getRankColor(o.rank);
                const curGroup = getRankGroup(o.rank);
                const prevGroup = i > 0 ? getRankGroup(filtered[i-1].rank) : curGroup;
                const groupBorder = i > 0 && curGroup !== prevGroup
                  ? "3px solid rgba(255,255,255,0.12)"
                  : "1px solid var(--border)";
                const rowBg = isAlert ? "rgba(231,76,60,0.13)" : isCB ? "rgba(30,95,196,0.10)" : rc.row;
                const rowShadow = isAlert ? "inset 3px 0 0 #e74c3c" : isCB ? "inset 3px 0 0 #4a7fd4" : "none";
                const nameCl = isAlert ? "#ff4444" : isCB ? "#7fb3ff" : rc.name;
                rows.push(
                  <tr key={o.id} style={{background:selected.has(o.id)?"rgba(30,95,196,0.18)":rowBg, borderTop:groupBorder, boxShadow:rowShadow}}>
                    {isAdmin&&<td><input type="checkbox" checked={selected.has(o.id)} onChange={()=>toggleSelect(o.id)}/></td>}
                    <td><span className="badge-num" style={isAlert?{color:"#ff4444"}:{}}>{o.badge ? "#"+o.badge : ""}</span></td>
                    <td className="name" style={{color:nameCl, textShadow:isAlert?"0 0 10px rgba(231,76,60,0.5)":"none"}}>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        {o.name}
                        {isCB&&<span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,fontWeight:700,color:"#e8c96a",background:"rgba(200,168,75,0.15)",border:"1px solid rgba(200,168,75,0.4)",borderRadius:3,padding:"1px 5px",letterSpacing:1}}>CB</span>}
                        {getRankGroup(o.rank)==="highcommand"&&<span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,fontWeight:700,color:"#d4bfff",background:"rgba(30,10,50,0.75)",border:"1px solid rgba(160,100,255,0.35)",borderRadius:3,padding:"1px 5px",letterSpacing:1}}>HC</span>}
                      </div>
                    </td>
                    <td style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:isAlert?"rgba(255,100,100,0.7)":"var(--gray)"}}>{o.nick}</td>
                    <td><div style={{display:"flex",flexDirection:"column",gap:3}}><span className="rk">{RANK_BADGES[o.rank]||o.rank}</span><span style={{fontSize:11,color:"var(--gray)"}}>{o.rank}</span></div></td>
                    <td><span className={`status ${st.cls}`}>{st.label}</span></td>
                    <td><Ck val={o.swat}/></td><td><Ck val={o.iad}/></td><td><Ck val={o.ftd}/></td>
                    <td style={{borderLeft:"2px solid rgba(200,168,75,0.3)"}}><Ck val={o.fac}/></td>
                    <td><Ck val={o.seu}/></td><td><Ck val={o.sv}/></td>
                    <td><Ck val={o.nt}/></td><td><Ck val={o.pwc}/></td><td><Ck val={o.wu}/></td><td><Ck val={o.k9}/></td><td><Ck val={o.asu}/></td>
                    {isAdmin&&<td><div className="actions">
                      <button className="btn btn-gold btn-sm" onClick={()=>setModal({type:"edit",officer:o})}>EDYTUJ</button>
                      <button className="btn btn-red btn-sm" onClick={()=>remove(o.id)}>USUŃ</button>
                    </div></td>}
                  </tr>
                );
              });
              return rows;
            })()}
            {filtered.length===0&&<tr><td colSpan={16} style={{textAlign:"center",padding:32,color:"var(--gray)"}}>Brak wyników</td></tr>}
          </tbody>
        </table>
      </div>
      {modal&&<OfficerModal officer={modal.officer} isNew={modal.type==="add"} onSave={save} onClose={()=>setModal(null)}/>}
      {bulkModal&&<BulkEditModal officers={officers} selectedIds={selected} onSave={bulkSave} onClose={()=>setBulkModal(false)}/>}
    </div>
  );
}

          </tbody>
        </table>
      </div>
    </div>
  );
}

function RegulationsView({ regs, setRegs, isAdmin }) {
  const [editing, setEditing] = useState(null); const [adding, setAdding] = useState(false); const [newText, setNewText] = useState("");

  const add    = () => { if(!newText.trim()) return; setRegs(p=>[...p,{id:Date.now(),text:newText.trim()}]); setNewText(""); setAdding(false); };
  const remove = id => { if(window.confirm("Usunąć punkt?")) setRegs(p=>p.filter(r=>r.id!==id)); };
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:12}}>
        <div><div className="page-title">REGULAMIN LSPD</div><div className="page-sub">{regs.length} PUNKTÓW</div></div>
        {isAdmin&&<button className="btn btn-primary" onClick={()=>setAdding(true)}>+ DODAJ PUNKT</button>}
      </div>
      {adding&&(
        <div className="card" style={{marginBottom:16}}>
          <div className="fg" style={{marginBottom:10}}><label>Nowy punkt regulaminu</label><textarea value={newText} onChange={e=>setNewText(e.target.value)} rows={3}/></div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-primary btn-sm" onClick={add}>DODAJ</button>
            <button className="btn btn-red btn-sm" onClick={()=>{setAdding(false);setNewText("");}}>ANULUJ</button>
          </div>
        </div>
      )}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {regs.map((r,i)=>(
          <div key={r.id} style={{display:"flex",gap:12,alignItems:"flex-start",background:"var(--card)",border:"1px solid var(--border)",borderRadius:4,padding:"14px 16px"}}>
            <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:16,color:"var(--accent)",minWidth:28,fontWeight:"bold"}}>{String(i+1).padStart(2,"0")}</div>
            {editing===r.id
              ? <div style={{flex:1}}><textarea defaultValue={r.text} rows={2} style={{width:"100%",background:"rgba(255,255,255,.04)",border:"1px solid var(--accent)",borderRadius:3,color:"var(--white)",padding:"6px 8px",fontSize:13,fontFamily:"'Source Sans 3',sans-serif"}} onBlur={e=>save(r.id,e.target.value)} autoFocus/></div>
              : <div style={{flex:1,fontSize:14,color:"var(--gray)",lineHeight:1.6}}>{r.text}</div>}
            {isAdmin&&<div style={{display:"flex",gap:4,flexShrink:0}}>
              <button className="btn btn-gold btn-sm" onClick={()=>setEditing(editing===r.id?null:r.id)}>EDYTUJ</button>
              <button className="btn btn-red btn-sm" onClick={()=>remove(r.id)}>✕</button>
            </div>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────────────────────
function App() {
  const [loading,    setLoading]    = useState(true);
  const [showLogin,  setShowLogin]  = useState(false);
  const [saveStatus, setSaveStatus] = useState("idle");

  // Sesja — zapamiętana w sessionStorage (trwa do zamknięcia karty)
  const [admin, setAdminRaw] = useState(() => {
    try { const s = sessionStorage.getItem("lspd-session"); return s ? JSON.parse(s) : null; } catch { return null; }
  });
  const setAdmin = (user) => {
    setAdminRaw(user);
    try { user ? sessionStorage.setItem("lspd-session", JSON.stringify(user)) : sessionStorage.removeItem("lspd-session"); } catch {}
  };

  // Aktywna zakładka — zapamiętana w sessionStorage
  const [page, setPageRaw] = useState(() => {
    try { return sessionStorage.getItem("lspd-page") || "dashboard"; } catch { return "dashboard"; }
  });
  const setPage = (p) => {
    setPageRaw(p);
    try { sessionStorage.setItem("lspd-page", p); } catch {}
  };

  const [officers, setOfficersRaw] = useState([]);
  const [log,      setLogRaw]      = useState([]);
  const [regs,     setRegsRaw]     = useState([]);

  // Refs żeby mieć zawsze aktualne wartości w callbackach
  const officersRef = useRef([]);
  const logRef      = useRef([]);
  const regsRef     = useRef([]);

  useEffect(() => { officersRef.current = officers; }, [officers]);
  useEffect(() => { logRef.current      = log;      }, [log]);
  useEffect(() => { regsRef.current     = regs;     }, [regs]);

  // Ładowanie danych
  useEffect(() => {
    dbApi.load().then(data => {
      setOfficersRaw(data.officers || INIT.officers);
      setLogRaw(data.log           || INIT.log);
      setRegsRaw(data.regs         || INIT.regs);
      setLoading(false);
    });
  }, []);

  // Auto-save z debounce
  const saveTimer = useRef(null);
  const save = useCallback((officers, log, regs) => {
    setSaveStatus("saving");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await dbApi.save({ officers, log, regs });
        setSaveStatus("saved");
        setTimeout(() => setSaveStatus("idle"), 2000);
      } catch(e) {
        console.error("Save error:", e);
        setSaveStatus("error");
        setTimeout(() => setSaveStatus("idle"), 3000);
      }
    }, 800);
  }, []);

  const setOfficers = useCallback(upd => {
    setOfficersRaw(prev => {
      const next = typeof upd === "function" ? upd(prev) : upd;
      save(next, logRef.current, regsRef.current);
      return next;
    });
  }, [save]);

  const setLog = useCallback(upd => {
    setLogRaw(prev => {
      const next = typeof upd === "function" ? upd(prev) : upd;
      save(officersRef.current, next, regsRef.current);
      return next;
    });
  }, [save]);

  const setRegs = useCallback(upd => {
    setRegsRaw(prev => {
      const next = typeof upd === "function" ? upd(prev) : upd;
      save(officersRef.current, logRef.current, next);
      return next;
    });
  }, [save]);

  const PAGES = [
    {id:"dashboard",  label:"Dashboard"},
    {id:"officers",   label:"Funkcjonariusze"},
    {id:"log",        label:"Dziennik"},
    {id:"regulations",label:"Regulamin"},
  ];

  if (loading) return (
    <>
      <style>{CSS}</style>
      <div className="loading-wrap">
        <div className="loading-logo">LSPD</div>
        <div className="loading-bar"><div className="loading-inner"/></div>
        <div className="loading-text">{USE_CLOUD ? "Łączenie z bazą danych..." : "Ładowanie danych..."}</div>
      </div>
    </>
  );

  return (
    <>
      <style>{CSS}</style>
      <SaveIndicator status={saveStatus}/>
      {showLogin&&<LoginModal onLogin={u=>{setAdmin(u);setShowLogin(false);}} onClose={()=>setShowLogin(false)}/>}

      <div className="app">
        <header className="topbar">
          <div className="topbar-stripe"/>
          <div className="topbar-inner">
            <div style={{cursor:"pointer",flexShrink:0}} onClick={()=>setPage("dashboard")}>
              <div className="topbar-logo">LSPD</div>
              <div className="topbar-sub">Database {USE_CLOUD?"☁":"💾"}</div>
            </div>
            <a className="back-btn" href="index2.html">← MENU</a>
            <nav className="topbar-nav">
              {PAGES.map(p=>(
                <button key={p.id} className={`nav-btn ${page===p.id?"active":""}`} onClick={()=>setPage(p.id)}>{p.label}</button>
              ))}
            </nav>
            <div className="topbar-auth">
              <span className={`status-dot ${admin?"dot-on":"dot-off"}`}/>
              {admin
                ? <><span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:"var(--gold)"}}>{admin.role}</span><button className="btn btn-red btn-sm" onClick={()=>setAdmin(null)}>WYLOGUJ</button></>
                : <button className="btn btn-gold btn-sm" onClick={()=>setShowLogin(true)}>ZARZĄD LOGIN</button>}
            </div>
          </div>
        </header>

        <main className="main">
          {page==="dashboard"   && <Dashboard    officers={officers} log={log}/>}
          {page==="officers"    && <OfficersView officers={officers} setOfficers={setOfficers} isAdmin={!!admin}/>}
          {page==="log"         && <LogView      log={log} setLog={setLog} officers={officers} isAdmin={!!admin}/>}
          {page==="regulations" && <RegulationsView regs={regs} setRegs={setRegs} isAdmin={!!admin}/>}
        </main>

        <footer style={{borderTop:"1px solid var(--border)",padding:"16px 24px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
          <div style={{fontFamily:"'Oswald',sans-serif",fontSize:16,fontWeight:700,letterSpacing:4,color:"var(--gold)"}}>LSPD</div>
          <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:"var(--dim)"}}>
            {USE_CLOUD?"☁ JSONBin Cloud Sync":"💾 Local Storage"} · DATABASE v3.0
          </div>
        </footer>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
